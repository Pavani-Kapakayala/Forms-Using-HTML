<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <fieldset>
        <h1 align="center">TELANGANA STATE ROAD TRANSPORT CORPORATION</h1>
        <H1 align="center">GENERAL BUS PASS APPLICATION</H1>
    </fieldset>
    <fieldset>
        <legend>
            <h3>Applicant Details</h3>
        </legend>
        <label for="name">Name *</label>
        <input id="name" name="name" required maxlength="20">
        <label for="fathername" style="margin-left: 40%;">Father's /Guardian's Name *</label>
        <input id="fathername" name="fathername" required maxlength="20">
        <br><br>
        <label for="dob">Date of birth *</label>
        <input type="date" id="dob" name="dob" required>
        <label for="gender" style="margin-left: 50%;">Gender *</label>
        <input type="radio" id="gender" name="gender" value="Male">Male
        <input type="radio" id="gender" name="gender" value="Female">Female
        <br><br>
        <label for="age">Age As on :</label>
        <input type="number" id="age" name="age" style="width: 2%;" required>
        <label for="age">Year(s)</label>
        <input type="number" id="age" name="age" style="width: 2%;">
        <label for="age">Month(s)</label>
        <input type="number" id="age" name="age" style="width: 2%;">
        <label for="age">Day(s)</label>
        <label for="aadharno" style="margin-left: 35.5%;">Aadhar Number : </label>
        <input type="number" id="aadharno" name="aadharno">
        <br><br>
        <label for="whatsapp">WhatsApp Number *</label>
        <input type="number" id="whatsapp" name="whatsapp" required pattern="[6-9]{10}">
        <label for="email" style="margin-left: 42%;">E-mail id *</label>
        <input type="email" id="email" name="email" required pattern="[A-Z][a-z 0-9]+@gmail.com">
        <br><br>
        <label for="photo">Photo *</label>
        <input type="file" required> <br><br>
    </fieldset>
    <fieldset>
        <legend>
            <h3>Residential Address Details</h3>
        </legend>
        <label for="applicant">Applicant Address * <br>
        </label>
        <textarea id="applicant" name="applicant" required rows="4" cols="50"></textarea>
        <label for="" district" style="margin-left: 35%;">District *</label>
        <select id="district" name="district" required>
            <option value="select" hidden selected>--select--</option>
            <option>HYDERABAD</option>
        </select>
        <br><br>
        <label for="mandal">Mandal *</label>
        <select id="mandal" name="mandal" required>
            <option value="select" hidden selected>--select--</option>
            <option>HYDERABAD</option>
        </select>
        <label for="village" style="margin-left: 51.5%;"> Village *</label>
        <select id="village" name="village" required>
            <option value="select" hidden selected>--select--</option>
            <option>HYDERABAD</option>
            <option>JAYADHARSHINI</option>
        </select>
        <br><br>
        <label for="pincode">Pincode *</label>
        <input type="text" id="" pincode" name="pincode" required pattern="[0-9]{6}">
    </fieldset>
    <Fieldset>
        <legend>
            <h3>Pass Type Details</h3>
        </legend>
        <label for="city">City *</label>
        <select id="city" name="city" required>
            <option value="select" hidden selected>--select--</option>
            <option>HYDERABAD</option>
        </select>
        <br><br>
        <label for="pass">Pass Type *</label>
        <select id="pass" name="pass" required>
            <option value="select" hidden selected>--select--</option>
            <option value="Greater Pass">Greater Pass</option>
            <option value="General Ordinary Route pass">General Ordinary Route pass</option>
            <option value="general Express Metro Route Pass">General Express Metro Route Pass</option>
            <option value="ordinary pass">Ordinary Pass</option>
            <option value="Metro Express Pass">Metro Express Pass</option>
            <option value="Metro Express Delux Pass">Metro Express Delux Pass</option>
        </select>
    </Fieldset>
    <Fieldset>
        <legend>
            <h3>Mode of Payment & Pass Collection</h3>
        </legend>
        <label for="payment">Payment Mode *</label>
        <select id="payment" name="payment" required>
            <option value="select" hidden selected>Sellect Payment Mode</option>
            <option value="Cash">Payment at Counter</option>
        </select>
        <br><br>
        <label for="delivery">Pass Delivery Mode *</label>
        <select id="delivery" name="delivery" required>
            <option value="select" hidden selected>Select Pass Delivery Mode</option>
            <option value="counter delivery">At counter</option>
        </select>
        <br><br>
        <label for="center">Center at which you want to collect Pass *</label>
        <select id="center" name="center" required>
            <option value="select" hidden selected>Select Center</option>
            <option value="Hyderabad">Hyderabad</option>
            <option value="Warangal">Warangal</option>
            <option value="Karimnagar">Karimnagar</option>
            <option value="Khammam">Khammam</option>
            <optgroup label="Nizamabad">
                <option value="Nizamabad">Nizamabad</option>
                <option value="Adilabad">Adilabad</option>
                <option value="Sangareddy">Sangareddy</option>
            </optgroup>
            <option value="Medak">Medak</option>
            <option value="Mahabubnagar">Mahabubnagar</option>
            <option value="Nalgonda">Nalgonda</option>
            <option value="Rangareddy">Rangareddy</option>
        </select>
    </Fieldset>
    <br><br>
    <input type="submit" value="Submit" align="center" style="margin-left: 50%; ">
</body>

</html>
